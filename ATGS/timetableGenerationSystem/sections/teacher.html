<button class="ghost" id="toggleform" onclick="toggleView();">Toggle Form</button>
<div class="addnew-block" id="newTeacher">
    <p class="blockHeading">Add New Teacher</p>
    <form id="form" onsubmit="" method="POST">
        <fieldset>
            <div>
                <label for="teacherId">Teacher Id</label>
                <input type="text" name="teacherId" id="teacherId" placeholder="Auto Generated (Disabled)" readonly>
            </div>
        </fieldset>
        <fieldset>
            <div>
                <select class="dropdown myInput" name="departmentDropdown" id="departmentDropdown" disabled required>
                    <option value="" disabled selected>Select Department</option>
                </select>
            </div>
        </fieldset>
        <fieldset>
            <div>
                <label for="fname">*Teacher FirstName</label>
                <input id="fname" type="text" name="fname" placeholder="John" required>
            </div>
            <div>
                <label for="lname">*Techer LastName</label>
                <input id="lname" type="text" name="lname" placeholder="Doe" required>
            </div>
        </fieldset>
        <fieldset>
            <div>
                <input name="isPartTime" id="isPartTime" type="checkbox" onchange="togglePartTimeSection()" required="false">
                <span><label for="isPartTime">Part Time</label></span>
            </div>
            <div id="partTimeSection"></div> 
        </fieldset>
        <div class="btn-grp">
            <button class="secondary btn" id="sndyBtn" onclick="resetForm();" type="button">Clear</button>
            <button class="primary btn" id="prmyBtn" onclick="add_teacher();" type="button">Create</button>
        </div>
    </form>
</div>
<hr>
<div class="view-table">
    <table>
        <caption>
            Existing Teachers
        </caption>
        <thead>
            <tr>
                <td >Sr No</td>
                <td >UID</td>
                <td >Department</td>
                <td >Teacher name</td>
                <td >Part Time</td>
                <td >Actions</td>
            </tr>
        </thead>
        <tbody class="recordTable">
        </tbody>
    </table>
</div>
<script>

function togglePartTimeSection(){
    if($('#isPartTime').is(':checked')){
        $('#partTimeSection').attr('disabled', false);
        $('#partTimeSection').attr('hidden', false);
        $('#partTimeSection').css('display', 'block');
    }
    else{
        $('#partTimeSection').attr('disabled', true);
        $('#partTimeSection').attr('hidden', true);
        $('#partTimeSection').css('display', 'none');
    }
}
function togglePartTimeDay(event){
    const fieldset = event.target.closest('fieldset');
    const timepicker = fieldset.querySelector('.timePicker');
    timepicker.style.display = event.target.checked ? "flex" : "none";
}
async function makePartTimeDay() {
    console.log("In the maker function");
    const result = await load_existing("timeslot");
    const days = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];
    
    const data = result.responseBody;
    const punchInOptions = data.map(item =>
        `<option value="${item[0]}">${item[1]}</option>`
    ).join("");
    const punchOutOptions = data.map(item =>
        `<option value="${item[0]}">${item[2]}</option>`
    ).join("");
    // console.log(punchInOptions);
    // console.log(punchOutOptions);
    const container = $("#partTimeSection");
    container.html("");
    // console.log("creatind day wise item");
    days.forEach(day => {
        
        const id = day.toLowerCase();
        container.append(`
            <fieldset>
                <div>
                    <input
                        type="checkbox"
                        id="${id}"
                        name="${id}"
                        onchange="togglePartTimeDay(event)">
                    <label for="${id}">${day}</label>
                </div>

                <div class="timePicker" style="display:none">
                    <p>
                        <label>Punch In</label>
                        <select name="punchIn_${id}" id="punchIn_${id}" class="dropdown myInput" required>
                            <option value="" selected disabled>00:00:00</option>
                            ${punchInOptions}
                        </select>
                    </p>

                    <span class="separator">-</span>

                    <p>
                        <label>Punch Out</label>
                        <select name="punchOut_${id}" id="punchOut_${id}" class="dropdown myInput" required>
                            <option value="" selected disabled>00:00:00</option>
                            ${punchOutOptions}
                        </select>
                    </p>
                </div>
            </fieldset>
        `);
    });
}
async function extractDepartment() {
    const minimalData = await getPrerequisits('department');
    const depts = await minimalData.responseBody.departments;
    const departmentSelect = $('#departmentDropdown');
    await depts.forEach(dept => {
        departmentSelect.append(`
            <option value="${dept.DEPARTMENT_ID}">
                ${dept.LONG_NAME}
            </option>
        `);
    });
    await departmentSelect.prop('disabled', false);
}

makePartTimeDay();
extractDepartment();


var form = document.getElementById('form');

async function add_teacher() {
    console.log("Adding new Teacher");
    if(!form.checkValidity()){
        // form.reportValidity();
        // return;
    };
    const formData = new FormData(form);
    formData.append('formCategory', 'teacher');
    formData.append('formType', 'add_teacher');
    
    $.ajax({
        url: 'api.php',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        dataType: "json"
    })
    .done(function(result) {
        showInfoInline(result.responseBody);
        form.reset();
        createTimeslotTable();
    })
    .fail(function(xhr, status, error) {   
        if (xhr.responseJSON && xhr.responseJSON.responseBody) {
            showInfoInline(xhr.responseJSON.responseBody);
        } else {
            showInfoInline("An unexpected error occurred.");
        }
    });
}

async function get_one_teacher(teacherId){
    const formData = new FormData();
    formData.append("formCategory","teacher");
    formData.append("formType","get_one_teacher");
    formData.append("teacherId",teacherId);
    return await $.ajax({
        url:"api.php",
        type:"POST",
        data:formData,
        processData:false,
        contentType:false
    });

}

async function prefillUpdateform(recordId){
    var oldData = await get_one_teacher(recordId);
    var parsedOldData = await oldData.responseBody;
    turnOn();
    $('#teacherId').val(parsedOldData.TEACHER_ID);
    $('#fname').val(parsedOldData.FIRST_NAME);
    $('#lname').val(parsedOldData.LAST_NAME);
    $('#isPartTime').prop('checked', parsedOldData.ISPARTTIME == 1);
    togglePartTimeSection();
    $('#prmyBtn').text('Update');
    $('#prmyBtn').attr('data-recordId',parsedOldData.TEACHER_ID);
    $('#prmyBtn').attr('onclick','update_teacher('+recordId+')');
    $('#sndyBtn').attr('onclick','cancelPrefilledUpdateform()');
    showInfoInline("Update Form Ready");
}

function cancelPrefilledUpdateform(){
    form.reset();
    $('#teacherId').val("");
    $('#prmyBtn').text("Create");
    $('#prmyBtn').attr("onclick","add_teacher()");
    $('#sndyBtn').attr("onclick","resetForm()");
    togglePartTimeSection();
}

async function update_teacher(){
    const formData = new FormData(form);
    formData.append("formCategory","teacher");
    formData.append("formType","update_teacher");
    $.ajax({
        url:"api.php",
        type:"POST",
        data:formData,
        processData:false,
        contentType:false,
        dataType:"json"
    })
    .done(function(result){
        cancelPrefilledUpdateform();
        showInfoInline(result.responseBody);
        createTeacherTable();
    })
    .fail(function(xhr){
        if(xhr.responseJSON) showInfoInline(xhr.responseJSON.responseBody);
        else showInfoInline("Unexpected Error");
    });
}

async function delete_teacher(recordId){
    const formData = new FormData();
    formData.append("formCategory","teacher");
    formData.append("formType","delete_teacher");
    formData.append("teacherId",recordId);
    const result = await $.ajax({
        url:"api.php",
        type:"POST",
        data:formData,
        processData:false,
        contentType:false
    });
    showInfoInline(result.responseBody);
    createTeacherTable();
}

async function createTeacherTable(){
    const slots = await load_existing('teacher');
    var count = 1;
    $('.recordTable').html('');
    (slots.responseBody).forEach(element => {
        console.log("Createing Teacher")
        var template =
            `<tr>
                <td>${count++}</td>
                <td>${element[0]}</td>
                <td>${element[1]}</td>
                <td>${element[2] + " " + element[3]}</td>
                <td>${element[4]}</td>
                <td>
                    <button class="btn primary" data-recordId="${element[0]}" onclick="prefillUpdateform(${element[0]});">update</button>
                    <button class="btn secondary" data-recordId="${element[0]}" onclick="confirmDeleteDialog('Delete ?','confirm the delete operations',${element[0]},delete_department);">Delete</button>
                </td>
            </tr>`;
        $('.recordTable').append('<tr>'+template+'</tr>');
    });
}

createTeacherTable();

</script>
