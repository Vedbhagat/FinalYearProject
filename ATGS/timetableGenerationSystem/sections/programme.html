<button class="ghost" id="toggleform" onclick="toggleView();">Toggle Form</button>
<div class="addnew-block">
    <p class="blockHeading">Add New Programme</p>
    <form id="form" onsubmit="" method="POST">
        <fieldset hidden>
            <div>
                <label for="programmeId">Programme Id</label>
                <input type="text" name="programmeId" id="programmeId" placeholder="Auto Generated (Disabled)" readonly>
            </div>
        </fieldset>
        <fieldset>
            <div>
                <label for="departmentId">Department</label>
                <select class="dropdown myInput" name="departmentId" id="departmentId">
                    <option value=""disabled selected>Select Department</option>
                </select>
            </div>
        </fieldset>
        <fieldset>
            <div>
                <label for="fullname">*Programme Fullname</label>
                <input id="fullname" name="fullname" type="text" placeholder="Bachelor of Science in Information Technology">
            </div>
            <div>
                <label for="shortname">*Programme ShortName</label>
                <input id="shortname" name="shortname" type="text" placeholder="B. Sc. I.T.">
            </div>
        </fieldset>
        <fieldset>
            <div>
                <label for="duration">Duration of programme</label>
                <select class="dropdown myInput" name="duration" id="duration" onchange="createDivisionInputs(this.value);">
                    <option value="" disabled selected>Select Duration</option>
                </select>
            </div>
        </fieldset>
        <fieldset id="divisionCountWrapper" hidden>
            <legend>Year wise division count (division code will be auto generated)</legend>
        </fieldset>
        <div class="btn-grp">
            <button class="secondary btn" id="sndyBtn" onclick="resetForm();" type="button">Clear</button>
            <button class="primary btn" id="prmyBtn" onclick="add_programme();" type="button">Create</button>
        </div>
    </form>
</div>
<hr>
<div class="view-table">
    <table>
        <caption>
            Existing Programmes
        </caption>
        <thead>
            <tr>
                <td >Sr No</td>
                <td >UID</td>
                <td >Department</td>
                <td >Programme</td>
                <td >Programme(ShortName)</td>
                <td >Years</td>
                <td >Actions</td>
            </tr>
        </thead>
        <tbody class="recordTable">

        </tbody>
    </table>
</div>
<script>

var form = document.getElementById('form');

async function populateDepartment() {
    const minimalData = await getPrerequisits('department');
    const depts = await minimalData.responseBody.departments;
    const departmentSelect = $('#departmentId');
    await depts.forEach(dept => {
        departmentSelect.append(`
            <option value=${dept.DEPARTMENT_ID}>
                ${dept.LONG_NAME}
            </option>
        `);
    });
    await departmentSelect.prop('disabled', false);

}
async function populateYear() {
    const minimalData = await getPrerequisits('year');
    const years = await minimalData.responseBody.years;
    const yearSelect = $('#duration');
    let counter = 1
    await years.forEach(year => {
        yearSelect.append(`
            <option value="${counter++}">
                ${year.YEAR_NAME}
            </option>
        `);
    });
    await yearSelect.prop('disabled', false);
}
function createDivisionInputs(duration) {
    duration = parseInt(duration) || 0;

    const wrapper = $('#divisionCountWrapper');

    // Save existing division values before removing the inputs
    const existingValues = {};

    wrapper.find('input[id^="division"]').each(function () {
        const year = $(this).attr('id').replace('division', '');
        existingValues[year] = $(this).val();
    });

    // Remove all existing year inputs
    wrapper.empty();

    // Create required year inputs
    for (let year = 1; year <= duration; year++) {
        wrapper.append(`
            <div>
                <label for="division${year}">Divisions for Year ${year}</label>
                <input 
                    type="number"
                    id="division${year}"
                    name="division${year}"
                    class="form-control"
                    min="1"
                    max="5"
                >
            </div>
        `);

        // Restore previous value if this year already existed
        if (existingValues[year] !== undefined) {
            $(`#division${year}`).val(existingValues[year]);
        }
    }

    wrapper.prop('hidden', false);
}
populateDepartment()
populateYear()


async function add_programme() {
    if(!form.checkValidity()){
        form.reportValidity();
        return;
    };
    const formData = new FormData(form);
    formData.append('formCategory', 'programme');
    formData.append('formType', 'add_programme');
    console.log(formData);
    $.ajax({
        url: 'api.php',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        dataType: "json"
    })
    .done(function(result) {
        showInfoInline(result.responseBody);
        form.reset();
        createProgrammeTable();
    })
    .fail(function(xhr, status, error) {   
        if (xhr.responseJSON && xhr.responseJSON.responseBody) {
            showInfoInline(xhr.responseJSON.responseBody);
        } else {
            showInfoInline("An unexpected error occurred.");
        }
    });
}

async function prefillUpdateform(recordId) {
    const response = await get_one_programme(recordId);
    const data = response.responseBody;
    turnOn();
    // Fill normal programme fields
    $('#programmeId').val(data.PROGRAMME_ID);
    $('#departmentId').val(data.DEPARTMENT_ID);
    $('#fullname').val(data.LONG_NAME);
    $('#shortname').val(data.SHORT_NAME);
    $('#duration').val(data.DURATION);

    // Create ONLY the required year inputs
    createDivisionInputs(data.DURATION);

    // Fill existing division counts
    if (data.DIVISIONS) {
        for (const year in data.DIVISIONS) {
            $(`#division${year}`).val(data.DIVISIONS[year]);
        }
    }
    // Update button
    $('#prmyBtn')
        .text('Update')
        .attr('onclick','update_programme('+recordId+')');

    // Cancel button
    $('#sndyBtn')
        .text('Cancel')
        .attr('click', 'cancelPrefilledUpdateform()');

    $('#fullname').focus();

    showInfoInline("Update Form Ready");
}

function cancelPrefilledUpdateform() {
    // Reset all form controls
    form.reset();

    // Explicitly clear values
    $('#programmeId').val('');
    $('#departmentId').val('');
    $('#fullname').val('');
    $('#shortname').val('');
    $('#duration').val('');

    // Remove generated division inputs
    $('#divisionCountWrapper')
        .empty()
        .append('<legend>Year wise division count</legend>')
        .prop('hidden', true);

    // Restore Create button
    $('#prmyBtn')
        .text('Create')
        .removeAttr('data-recordId')
        .attr('onclick','add_programme()');

    // Restore Clear button
    $('#sndyBtn')
        .text('Clear')
        .off('click')
        .attr('click', 'cancelPrefilledUpdateform()');

    showInfoInline("Update Cancelled");
}

async function update_programme(recordId){
    if(!form.checkValidity()){
        form.reportValidity();
        return;
    };
    const formData = new FormData(form);
    formData.append('formCategory', 'programme');
    formData.append('formType','update_programme');
    
    $.ajax({
        url: 'api.php',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false,
        dataType: "json"
    })
    .done(function(result) {
        form.reset();
        cancelPrefilledUpdateform();
        showInfoInline(result.responseBody);
        createProgrammeTable();
    })
    .fail(function(xhr, status, error) { 
        if (xhr.responseJSON && xhr.responseJSON.responseBody) {
            showInfoInline(xhr.responseJSON.responseBody);
        }else {
            showInfoInline("An unexpected error occurred.");
        }
    });
}

async function get_one_programme(programmeId) {
    const formData = new FormData();
    formData.append('formCategory', 'programme');
    formData.append('formType', 'get_one_programme');
    formData.append('programmeId', programmeId);
    const result = await $.ajax({
        url: 'api.php',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false
    });
    return result;
}

async function delete_programme(recordId) {
    const formData = new FormData();
    formData.append('formCategory', 'programme');
    formData.append('formType', 'delete_programme');
    formData.append('programmeId', recordId);
    const result = await $.ajax({
        url: 'api.php',
        type: 'POST',
        data: formData,
        processData: false,
        contentType: false
    });
    showInfoInline(result.responseBody);
    await createProgrammeTable();
    return result;
}

async function createProgrammeTable(){
    const programme = await load_existing('programme');
    const consists = await load_existing('consists');
    const depts = await getPrerequisits('department');
    const deptsParsed = await depts.responseBody.departments;
    var count = 1;
    
    $('.recordTable').html('');
    (programme.responseBody).forEach(element => {
        const currDept = deptsParsed.find(
            department => department.DEPARTMENT_ID == element[1]
        )?.SHORT_NAME ?? '';
        const duration = consists.responseBody.filter(
            c => c[1] == element[0]
        ).length;
        var template =
            `<tr>
                <td>${count++}</td>
                <td>${element[0]}</td>
                <td>${currDept}</td>
                <td>${element[2]}</td>
                <td>${element[3]}</td>
                <td>${duration}</td>
                <td>
                    <button class="btn primary" data-recordId="${element[0]}" onclick="prefillUpdateform(${element[0]});">update</button>
                    <button class="btn secondary" data-recordId="${element[0]}" onclick="confirmDeleteDialog('Delete ?','confirm the delete operations',${element[0]},delete_programme);">Delete</button>
                </td>
            </tr>`;
        $('.recordTable').append('<tr>'+template+'</tr>');
    });
}

createProgrammeTable();
</script>
